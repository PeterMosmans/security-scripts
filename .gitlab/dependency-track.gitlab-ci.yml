---
# Job template - to be used in a pipeline by including this file.
#
# Uploads an SBOM file to a Dependency-Track server
#
# Variables:
# DEPENDENCY_URL - location of Dependency-Track API server
# DEPENDENCY_KEY - authentication token
# TOOLS_VERSION  - specifies which version of gofwd/tools-image is being used

dependency-track:
  extends: .security
  image:
    name: gofwd/tools-image:$TOOLS_VERSION
    entrypoint: [""]
  variables:
    GIT_DEPTH: 1
    GIT_STRATEGY: fetch
  script:
    - >
      curl "$DEPENDENCY_URL/api/v1/bom"
      -H "X-Api-Key: $DEPENDENCY_KEY"
      -F "autoCreate=true"
      -F "projectName=$CI_PROJECT_TITLE"
      -F "projectVersion=$CI_COMMIT_BRANCH"
      -F "bom=@cyclonedx.json"
  rules:
    - if: "$DEPENDENCY_KEY != null"
      when: always
