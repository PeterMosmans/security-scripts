---
# Job template - to be used in a pipeline by including this file.
#
# Lints a Docker image in the form of a tar file.
#
# Variables:
# DOCKLE_PARMS   - Dockle configuration parameters, e.g., "--ignore CIS-DI-0001"
# DOCKLE_VERSION - specifies which version of goodwithtech/dockle is being used

lint_image:
  extends: .security
  dependencies:
    - build
  variables:
    GIT_STRATEGY: none
  image:
    name: goodwithtech/dockle:$DOCKLE_VERSION
    entrypoint: [""]
  script:
    - mkdir -p reports || true
    - >
      dockle --input ${IMAGE_TAR} ${DOCKLE_PARMS} --exit-code 1 |
      tee reports/dockle-report.txt
  artifacts:
    paths:
      - reports/dockle-report.txt
    when: always
