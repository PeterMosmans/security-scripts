---
# Job template - to be used in a pipeline by including this file.
#
# Performs a local scan using sonar-scanner and uploads the results.
#
# Variables:
# SONAR_URL     - location of SonarQube
# SONAR_TOKEN   - authentication token
# TOOLS_VERSION - specifies which version of gofwd/tools-image is being used

sonarqube:
  extends: .sast
  dependencies: []
  variables:
    GIT_DEPTH: 1
    GIT_STRATEGY: fetch
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  image:
    name: gofwd/tools-image:$TOOLS_VERSION
    entrypoint: [""]
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - >
      sonar-scanner -Dsonar.host.url=${SONAR_URL}
      -Dsonar.projectKey=${CI_PROJECT_NAME}
  rules:
    - if: "$SONAR_TOKEN != null"
      when: always
