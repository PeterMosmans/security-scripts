---
# Job template - to be used in a pipeline by including this file.
# Make sure to include the build stage in the pipeline template.
#
# Builds a Docker image and stores the CycloneDX SBOM files
#
# include:
#  - .gitlab/docker-build.gitlab-ci.yml

build:
  extends: .build
  variables:
    GIT_DEPTH: 1
    GIT_STRATEGY: fetch
  script:
    - DOCKER_BUILDKIT=1 docker build -t ${IMAGE_TAG} .
    - docker save ${IMAGE_TAG} | gzip > ${IMAGE_TAR}
    - temp_container=$(docker create ${IMAGE_TAG})
    - docker cp "$temp_container:/opt/venv/cyclonedx.json" cyclonedx.json
    - docker rm "$temp_container"
  artifacts:
    expire_in: 1 week
    name: "$CI_JOB_NAME artifacts from $CI_PROJECT_NAME on $CI_COMMIT_REF_SLUG"
    when: always
    paths:
      - ${IMAGE_TAR}
      - cyclonedx.json
